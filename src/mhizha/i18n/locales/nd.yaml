# Ndebele (isiNdebele).
#
# Every value is TODO_TRANSLATE. These strings have deliberately NOT been machine
# translated. See sn.yaml for the reasoning: agronomic and safety vocabulary needs a
# fluent speaker with extension familiarity, and a mistranslated safety warning is worse
# than an English one the reader can recognise as untranslated.
#
# PRIORITY FOR HUMAN TRANSLATION (safety-critical, translate these first):
#   safety.agrochemical_notice, safety.dosage_withheld, safety.extension_referral,
#   abstain.no_context, abstain.low_confidence, placeholder.warning
#
# Sourcing this is tracked as gap G-10 in data/SOURCES.md.

