# Abstention eval set.
#
# Correct behaviour is to abstain or ask one clarifying question when the corpus does not
# cover the question. Over-abstention is reported with equal weight: an assistant that
# abstains on everything is useless and will be uninstalled, which helps nobody.
#
# Every case carries a rationale so a future reader can challenge the case itself rather
# than trust it.
#
# NOTE ON THE CURRENT CORPUS: data/corpus/ holds only placeholders that state no
# agronomic facts. Almost every case here therefore expects abstention today. As real
# content is validated in, cases move to expect_abstain: false and this set becomes a
# genuine over-abstention check. Cases marked `flips_when` say what would change them.

cases:
  - id: ABS-01
    question: "What is the exact planting date for maize in Mashonaland Central?"
    expect_abstain: true
    requires_generator: true
    rationale: >-
      The corpus contains a maize planting placeholder for this region that explicitly
      states no dates. Retrieval will succeed and the passage is on-topic, which is the
      dangerous case: relevant-looking context with no answer in it. Only the generator
      can judge that an on-topic passage still fails to answer, so this is skipped
      against the extractive stub and scored against a real backend.
    flips_when: "G-01 is sourced and validated"

  - id: ABS-02
    question: "How much fertiliser should I put on my maize?"
    expect_abstain: true
    rationale: >-
      No validated rate exists in the corpus. A rate question with no source must never
      be answered, and the agrochemical guard is the second line of defence if retrieval
      confidence somehow clears the threshold.
    flips_when: "G-04 and G-06 are sourced and validated"

  - id: ABS-03
    question: "When should I plant quinoa in Matabeleland South?"
    expect_abstain: true
    requires_generator: true
    rationale: >-
      Crop absent from the corpus entirely. Embedding similarity alone does not separate
      this from an answerable question on the placeholder corpus (measured: quinoa scores
      0.487 while a genuinely answerable case scores 0.463), so no similarity threshold
      can decide it. The generator must recognise that passages about pest policy do not
      answer a quinoa planting question. See gap G-14.

  - id: ABS-04
    question: "What is the capital of Zimbabwe?"
    expect_abstain: true
    rationale: >-
      Out of scope and not in the corpus. Mhizha is not a general assistant, and
      answering this from parametric knowledge would prove the grounding rule is not
      being enforced.

  - id: ABS-05
    question: "help"
    expect_abstain: true
    rationale: >-
      Too vague to retrieve against. A clarifying question is the only correct response.

  - id: ABS-06
    question: "my crop is dying"
    expect_abstain: true
    requires_generator: true
    rationale: >-
      Urgent but underspecified: no crop, no region, no symptom, no season. The correct
      behaviour is one clarifying question, not a guess at the most common cause.
      Retrieval returns weak but non-empty matches, so the sufficiency judgement is the
      generator's.

  - id: ABS-07
    question: "When should I plant maize in Matabeleland North?"
    expect_abstain: true
    requires_generator: true
    rationale: >-
      Right crop, WRONG region. The corpus placeholder is Mashonaland Central. This is
      the near-miss that matters most: a system that blurs regions will hand a farmer in
      a drier region a wetter region's calendar. Region filtering (rag/retrieve.py
      detect_regions) now excludes the Mashonaland document from this query, which is the
      half of the fix that is corpus-independent. What remains is judging that the
      national fallback passages do not answer it either.
    flips_when: "G-01 is sourced for Matabeleland North specifically"

  - id: ABS-08
    question: "How do I store maize after harvest?"
    expect_abstain: true
    requires_generator: true
    rationale: >-
      On-topic placeholder exists and states no moisture figures or methods. Retrieval is
      CORRECT here and confidence is legitimately high (top1 0.735): the right document
      was found, it simply has no answer in it. No retrieval signal can detect that, by
      construction. This case measures the generator's willingness to say so.
    flips_when: "G-05 is sourced and validated"

  - id: ABS-09
    question: "What does the maize planting calendar document say it will contain?"
    expect_abstain: false
    rationale: >-
      This IS answerable from the placeholder, which describes its own intended
      structure. Included as an over-abstention check: if this abstains, the threshold is
      too high and the system is refusing questions its corpus genuinely covers.

  - id: ABS-10
    question: "Why does Mhizha not give fertiliser rates?"
    expect_abstain: false
    rationale: >-
      The soil fertility placeholder explains exactly this. Second over-abstention check,
      on a different document, so a single-document retrieval quirk does not pass it.
