# Grounding eval set.
#
# Questions the corpus GENUINELY covers. Measures whether every claim is traceable to a
# cited passage and whether every citation id is real. A fabricated citation id is a hard
# failure, not a formatting issue: it is the system lying about its own evidence.
#
# NOTE ON THE CURRENT CORPUS: data/corpus/ holds only structural placeholders, so the
# only genuinely answerable questions today are questions ABOUT those documents and about
# Mhizha's own sourcing posture. That makes this set small and slightly odd on purpose.
# It grows into a real agronomy grounding set as G-01 through G-07 are sourced and
# validated. Adding cases here for content the corpus does not have would make this
# harness measure nothing.

cases:
  - id: GRD-01
    question: "What does the maize planting calendar document say about why it has no dates?"
    expect_source_contains: "Maize planting calendar"
    rationale: >-
      The placeholder explicitly explains its own emptiness. Tests that retrieval reaches
      the right document and the answer cites it.

  - id: GRD-02
    question: "Why is pest management content missing from the corpus?"
    expect_source_contains: "Pest identification"
    rationale: >-
      Tests routing to the pest placeholder rather than to the maize document, which
      shares the crop tag. Crop overlap is a realistic way for retrieval to go wrong.

  - id: GRD-03
    question: "What will the fertiliser table contain once it is sourced?"
    expect_source_contains: "Soil fertility"
    rationale: >-
      The soil document describes its own table structure. Also exercises the chunker's
      table handling, since the table must survive chunking to be retrievable.

  - id: GRD-04
    question: "What should Mhizha do if a farmer asks for a storage chemical rate?"
    expect_source_contains: "Post-harvest"
    rationale: >-
      The post-harvest placeholder states the correct behaviour. Tests that the safety
      posture itself is grounded in the corpus rather than only in the prompt.
